syntax = "proto3";

package gamepb.qqvippb;

import "corepb.proto";

// ============ QQ会员服务 ============

// --- 刷新QQ会员信息 ---
message RefreshVipInfoRequest {}
message RefreshVipInfoReply {}

// --- 获取QQ会员礼包状态 ---
message GetQQVipRewardsStatusRequest {}

message QQVipRewardStatus {
    int32 type = 1;                // 礼包类型：1 每日礼包，2 其它/超级会员礼包
    repeated corepb.Item rewards = 2;
    bool is_enable = 3;            // 当前账号是否可见/可用
    int64 activity_id = 4;
    int64 reward_type = 5;         // 领取时提交的礼包类型
    int64 reward_multiplier = 6;
    int64 begin_time = 7;
    int64 end_time = 8;
}

message GetQQVipRewardsStatusReply {
    bool is_qq_vip = 1;
    bool can_claim = 2;
    bool claimed_today = 3;
    bool rewards_can_claim = 4;
    repeated QQVipRewardStatus reward_statuses = 5;
    bool has_redpoint = 6;
    int64 remaining_days = 7;
    int64 days_remaining_reminder = 8;
    bool mall_free_can_claim = 9;
}

// --- 领取QQ会员礼包 ---
message ClaimQQVipRewardsRequest {
    repeated int64 reward_types = 1 [packed = true];  // 每次只提交一个礼包类型
}

message ClaimQQVipRewardsReply {
    repeated corepb.Item items = 3;  // 奖励物品列表
}

// --- VIP信息更新通知 ---
message VipInfoUpdatedNTF {
    int64 vip_type = 1;
    int64 vip_level = 2;
}
